# External MySQL Blueprint retained for MySQL deployments.
services:
  - type: web
    name: shreeride-vfx
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        value: your-mysql-host
      - key: MYSQL_USER
        value: your-mysql-user
      - key: MYSQL_PASSWORD
        value: your-mysql-password
      - key: MYSQL_DATABASE
        value: ridex_db
      - key: GOOGLE_MAPS_API_KEY
        value: your-google-maps-api-key
