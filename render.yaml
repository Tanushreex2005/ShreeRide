# Render.com deployment configuration for ShreeRide VFX
# This file defines the services needed for deployment
#
# Render Blueprint for the PostgreSQL deployment.

databases:
  - name: shreeride-postgres
    databaseName: shreeride
    user: shreeride
    plan: basic-256mb

services:
  - type: web
    name: shreeride-vfx
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python init_postgres.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shreeride-postgres
          property: connectionString
